<button class="px-3 py-1 rounded-full font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-all duration-200" id="modeEditBtn" onclick="toggleTaskMode('edit')" type="button">

<button class="text-on-surface-variant hover:text-error font-label-lg text-label-lg transition-colors py-2 px-1 min-h-[44px] flex items-center" onclick="resetForm()" type="button">

<form class="flex flex-col gap-space-lg" id="taskForm" onsubmit="event.preventDefault(); saveTask();">
<!-- Title Section -->

          Task Title
        </label>
<span class="font-label-sm text-label-sm text-on-surface-variant" id="titleCounter">0/80</span>

<button class="inline-flex items-center gap-1 px-3 py-1.5 rounded-full bg-surface-container text-on-surface-variant hover:text-on-surface font-label-md text-label-md hover:bg-surface-container-high transition-colors min-h-[36px]" onclick="triggerAction('Attachment added')" type="button">
<span class="material-symbols-outlined text-[16px]">attach_file</span>

</button>
<button class="inline-flex items-center gap-1 px-3 py-1.5 rounded-full bg-surface-container text-on-surface-variant hover:text-on-surface font-label-md text-label-md hover:bg-surface-container-high transition-colors min-h-[36px]" onclick="insertSyntax('https://')" type="button">
<span class="material-symbols-outlined text-[16px]">link</span>
<span>Link</span>
</button>
</div>
</div>
<!-- Date & Time Row -->
<div class="grid grid-cols-2 gap-space-sm">
<!-- Date Picker Trigger -->
<div class="bg-surface-container-lowest p-space-md rounded-xl shadow-sm flex flex-col justify-between">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-2">Due Date</span>
<button class="flex items-center justify-between w-full min-h-[48px] px-3 py-2 rounded-lg bg-surface-container-low text-on-surface hover:bg-surface-container transition-colors" id="datePickerBtn" onclick="toggleDateSelection()" type="button">
<div class="flex items-center gap-2 min-w-0">
<span class="material-symbols-outlined text-primary text-[20px]">calendar_today</span>
<span class="font-body-md text-body-md font-semibold truncate" id="dateLabel">Today, Oct 24</span>
</div>
</button>
</div>
<!-- Time Picker Trigger -->
<div class="bg-surface-container-lowest p-space-md rounded-xl shadow-sm flex flex-col justify-between">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-2">Time</span>
<button class="flex items-center justify-between w-full min-h-[48px] px-3 py-2 rounded-lg bg-surface-container-low text-on-surface hover:bg-surface-container transition-colors" id="timePickerBtn" onclick="toggleTimeSelection()" type="button">
<div class="flex items-center gap-2 min-w-0">
<span class="material-symbols-outlined text-primary text-[20px]">schedule</span>
<span class="font-body-md text-body-md font-semibold truncate" id="timeLabel">02:30 PM</span>
</div>
</button>
</div>

<!-- Priority Selection Segment -->
<div class="flex flex-col gap-space-xs bg-surface-container-lowest p-space-md rounded-xl shadow-sm">
<div class="flex items-center justify-between mb-1">
<label class="font-label-md text-label-md text-on-surface-variant tracking-wider uppercase">Priority Level</label>
<span class="font-label-sm text-label-sm text-error font-semibold" id="priorityStatusNote">Critical Impact</span>
</div>
<div class="grid grid-cols-3 gap-space-xs" role="radiogroup">
<!-- Low Priority -->
<button class="flex items-center justify-center gap-1.5 min-h-[48px] py-2 px-3 rounded-lg bg-surface-container-low text-on-surface-variant font-label-lg text-label-lg transition-all" id="prio-low" onclick="selectPriority('low')" type="button">
<span class="material-symbols-outlined text-[18px]">low_priority</span>
<span>Low</span>
</button>
<!-- Medium Priority -->
<button class="flex items-center justify-center gap-1.5 min-h-[48px] py-2 px-3 rounded-lg bg-surface-container-low text-on-surface-variant font-label-lg text-label-lg transition-all" id="prio-med" onclick="selectPriority('med')" type="button">
<span class="material-symbols-outlined text-[18px] text-amber-500">flag</span>
<span>Medium</span>
</button>
<!-- High Priority (Active State by Default) -->
<button class="flex items-center justify-center gap-1.5 min-h-[48px] py-2 px-3 rounded-lg bg-error-container text-error font-label-lg text-label-lg shadow-sm transition-all" id="prio-high" onclick="selectPriority('high')" type="button">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">priority_high</span>
<span>High</span>
</button>
</div>
</div>
<!-- Category Selection -->
<div class="flex flex-col gap-space-xs bg-surface-container-lowest p-space-md rounded-xl shadow-sm">
<div class="flex items-center justify-between mb-1">
<label class="font-label-md text-label-md text-on-surface-variant tracking-wider uppercase">Category / Project</label>
<span class="material-symbols-outlined text-[18px] text-on-surface-variant">folder_open</span>
</div>
<div class="flex items-center gap-2 overflow-x-auto py-1">
<button class="category-chip px-3.5 py-2 rounded-full font-label-lg text-label-lg bg-primary-container text-on-primary shadow-sm flex items-center gap-1.5 min-h-[44px] shrink-0 transition-all" onclick="selectCategory(this)" type="button">
<span class="w-2 h-2 rounded-full bg-tertiary-fixed"></span>
<span>Work</span>
</button>
<button class="category-chip px-3.5 py-2 rounded-full font-label-lg text-label-lg bg-surface-container text-on-surface-variant hover:text-on-surface flex items-center gap-1.5 min-h-[44px] shrink-0 transition-all" onclick="selectCategory(this)" type="button">
<span class="w-2 h-2 rounded-full bg-secondary"></span>
<span>Personal</span>
</button>
<button class="category-chip px-3.5 py-2 rounded-full font-label-lg text-label-lg bg-surface-container text-on-surface-variant hover:text-on-surface flex items-center gap-1.5 min-h-[44px] shrink-0 transition-all" onclick="selectCategory(this)" type="button">
<span class="w-2 h-2 rounded-full bg-primary-fixed-dim"></span>
<span>Design</span>
</button>
<button class="category-chip px-3.5 py-2 rounded-full font-label-lg text-label-lg bg-surface-container text-on-surface-variant hover:text-on-surface flex items-center gap-1.5 min-h-[44px] shrink-0 transition-all" onclick="selectCategory(this)" type="button">
<span class="w-2 h-2 rounded-full bg-tertiary-container"></span>
<span>Finance</span>
</button>
<button class="px-3.5 py-2 rounded-full font-label-lg text-label-lg bg-surface-container-low text-primary hover:bg-surface-container flex items-center gap-1 min-h-[44px] shrink-0 transition-all" onclick="addNewCategoryPrompt()" type="button">
<span class="material-symbols-outlined text-[16px]">add</span>
<span>New Category</span>
</button>
</div>
</div>
<!-- Reminder & Notification Preferences Card -->
<div class="bg-surface-container-lowest p-space-md rounded-xl shadow-sm flex flex-col gap-space-sm">
<div class="flex items-center justify-between min-h-[48px]">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">notifications_active</span>
</div>
<div>
<div class="font-body-md text-body-md font-semibold text-on-surface">Reminder Alert</div>
<div class="font-label-md text-label-md text-on-surface-variant" id="reminderSubtitle">15 minutes before</div>
</div>
</div>
<!-- Custom Touch Accessible Toggle -->
<button aria-checked="true" class="w-12 h-7 rounded-full bg-primary-container p-0.5 transition-colors focus:outline-none flex items-center" id="reminderToggle" onclick="toggleReminderState()" role="switch" type="button">
<div class="w-6 h-6 rounded-full bg-surface-container-lowest shadow-sm transform translate-x-5 transition-transform" id="reminderThumb"></div>
</button>
</div>
<!-- Secondary vibration audio indicator pill -->
<div class="flex items-center justify-between pt-2 border-t-0 bg-surface-container-low px-3 py-2 rounded-lg">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-on-surface-variant text-[18px]">vibration</span>
<span class="font-label-md text-label-md text-on-surface-variant">Haptic alert enabled</span>
</div>
<span class="font-label-sm text-label-sm uppercase bg-surface-container-highest px-2 py-0.5 rounded text-on-surface">Standard</span>
</div>
</div>
<!-- Contextual Pro-Tip / Empty Guide -->
<div class="flex items-center gap-2.5 p-space-sm bg-surface-container-low rounded-lg text-on-surface-variant">
<span class="material-symbols-outlined text-primary text-[18px]">tips_and_updates</span>
<span class="font-body-sm text-body-sm">
<span class="font-semibold text-on-surface">Pro-tip:</span> Press Enter in the description to instantly generate structured sub-steps.
      </span>
</div>
<!-- Sticky / Bottom Action Area -->
<div class="flex flex-col gap-2 pt-2">
<button class="w-full min-h-[48px] py-3 px-6 rounded-xl bg-primary-container text-on-primary font-title-md text-title-md text-center shadow-md active:scale-[0.98] transition-all flex items-center justify-center gap-2" id="saveButton" type="submit">
<span class="material-symbols-outlined text-[20px]">check</span>
<span id="saveButtonLabel">Save Task</span>
</button>
<button class="w-full min-h-[44px] py-2.5 px-4 rounded-xl bg-transparent hover:bg-surface-container text-on-surface-variant font-label-lg text-label-lg text-center transition-colors" onclick="saveDraft()" type="button">
        Save as Draft
      </button>
</div>
</form>
</div>
<script>
  let reminderActive = true;
  let activePriority = 'high';

  function updateTitleCount(input) {
    const counter = document.getElementById('titleCounter');
    counter.textContent = `${input.value.length}/80`;
  }

  function toggleTaskMode(mode) {
    const addBtn = document.getElementById('modeAddBtn');
    const editBtn = document.getElementById('modeEditBtn');
    const titleInput = document.getElementById('taskTitle');
    const descInput = document.getElementById('taskDesc');
    const saveLabel = document.getElementById('saveButtonLabel');

    if (mode === 'edit') {
      editBtn.className = "px-3 py-1 rounded-full font-label-md text-label-md bg-surface-container-lowest text-primary shadow-sm transition-all duration-200";
      addBtn.className = "px-3 py-1 rounded-full font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-all duration-200";
      titleInput.value = "Finalize mobile design guidelines";
      descInput.value = "- [x] Color palette tokens\n- [ ] Micro-interactions specs";
      saveLabel.textContent = "Update Task";
      updateTitleCount(titleInput);
    } else {
      addBtn.className = "px-3 py-1 rounded-full font-label-md text-label-md bg-surface-container-lowest text-primary shadow-sm transition-all duration-200";
      editBtn.className = "px-3 py-1 rounded-full font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-all duration-200";
      titleInput.value = "";
      descInput.value = "";
      saveLabel.textContent = "Save Task";
      updateTitleCount(titleInput);
    }
  }

  function selectPriority(level) {
    activePriority = level;
    const low = document.getElementById('prio-low');
    const med = document.getElementById('prio-med');
    const high = document.getElementById('prio-high');
    const note = document.getElementById('priorityStatusNote');

    // Reset styles
    low.className = "flex items-center justify-center gap-1.5 min-h-[48px] py-2 px-3 rounded-lg bg-surface-container-low text-on-surface-variant font-label-lg text-label-lg transition-all";
    med.className = "flex items-center justify-center gap-1.5 min-h-[48px] py-2 px-3 rounded-lg bg-surface-container-low text-on-surface-variant font-label-lg text-label-lg transition-all";
    high.className = "flex items-center justify-center gap-1.5 min-h-[48px] py-2 px-3 rounded-lg bg-surface-container-low text-on-surface-variant font-label-lg text-label-lg transition-all";

    if (level === 'low') {
      low.className = "flex items-center justify-center gap-1.5 min-h-[48px] py-2 px-3 rounded-lg bg-surface-container-highest text-on-surface font-label-lg text-label-lg shadow-sm transition-all";
      note.textContent = "Standard Velocity";
      note.className = "font-label-sm text-label-sm text-on-surface-variant font-medium";
    } else if (level === 'med') {
      med.className = "flex items-center justify-center gap-1.5 min-h-[48px] py-2 px-3 rounded-lg bg-amber-50 text-amber-900 font-label-lg text-label-lg shadow-sm transition-all";
      note.textContent = "Moderate Priority";
      note.className = "font-label-sm text-label-sm text-amber-700 font-medium";
    } else if (level === 'high') {
      high.className = "flex items-center justify-center gap-1.5 min-h-[48px] py-2 px-3 rounded-lg bg-error-container text-error font-label-lg text-label-lg shadow-sm transition-all";
      note.textContent = "Critical Impact";
      note.className = "font-label-sm text-label-sm text-error font-semibold";
    }
  }

  function selectCategory(el) {
    document.querySelectorAll('.category-chip').forEach(chip => {
      chip.className = "category-chip px-3.5 py-2 rounded-full font-label-lg text-label-lg bg-surface-container text-on-surface-variant hover:text-on-surface flex items-center gap-1.5 min-h-[44px] shrink-0 transition-all";
    });
    el.className = "category-chip px-3.5 py-2 rounded-full font-label-lg text-label-lg bg-primary-container text-on-primary shadow-sm flex items-center gap-1.5 min-h-[44px] shrink-0 transition-all";
  }

  function addNewCategoryPrompt() {
    const catName = prompt("Enter new category name:");
    if (catName && catName.trim()) {
      const container = document.querySelector('.category-chip').parentElement;
      const newBtn = document.createElement('button');
      newBtn.type = "button";
      newBtn.className = "category-chip px-3.5 py-2 rounded-full font-label-lg text-label-lg bg-surface-container text-on-surface-variant hover:text-on-surface flex items-center gap-1.5 min-h-[44px] shrink-0 transition-all";
      newBtn.onclick = function() { selectCategory(this); };
      newBtn.innerHTML = `<span class="w-2 h-2 rounded-full bg-secondary-container"></span><span>${catName.trim()}</span>`;
      container.insertBefore(newBtn, container.lastElementChild);
      selectCategory(newBtn);
    }
  }

  function toggleReminderState() {
    reminderActive = !reminderActive;
    const btn = document.getElementById('reminderToggle');
    const thumb = document.getElementById('reminderThumb');
    const subtitle = document.getElementById('reminderSubtitle');

    btn.setAttribute('aria-checked', reminderActive);
    if (reminderActive) {
      btn.className = "w-12 h-7 rounded-full bg-primary-container p-0.5 transition-colors focus:outline-none flex items-center";
      thumb.className = "w-6 h-6 rounded-full bg-surface-container-lowest shadow-sm transform translate-x-5 transition-transform";
      subtitle.textContent = "15 minutes before";
      subtitle.className = "font-label-md text-label-md text-on-surface-variant";
    } else {
      btn.className = "w-12 h-7 rounded-full bg-surface-container-high p-0.5 transition-colors focus:outline-none flex items-center";
      thumb.className = "w-6 h-6 rounded-full bg-surface-container-lowest shadow-sm transform translate-x-0 transition-transform";
      subtitle.textContent = "Notifications off";
      subtitle.className = "font-label-md text-label-md text-on-surface-variant/60";
    }
  }

  function toggleDateSelection() {
    const label = document.getElementById('dateLabel');
    if (label.textContent === 'Today, Oct 24') {
      label.textContent = 'Tomorrow, Oct 25';
    } else {
      label.textContent = 'Today, Oct 24';
    }
  }

  function toggleTimeSelection() {
    const label = document.getElementById('timeLabel');
    if (label.textContent === '02:30 PM') {
      label.textContent = '05:00 PM';
    } else {
      label.textContent = '02:30 PM';
    }
  }

  function insertSyntax(snippet) {
    const desc = document.getElementById('taskDesc');
    desc.focus();
    const start = desc.selectionStart;
    const end = desc.selectionEnd;
    desc.value = desc.value.substring(0, start) + snippet + desc.value.substring(end);
    desc.selectionStart = desc.selectionEnd = start + snippet.length;
  }

  function triggerAction(msg) {
    const tip = document.getElementById('taskForm');
    const notification = document.createElement('div');
    notification.className = "fixed bottom-6 left-1/2 transform -translate-x-1/2 px-4 py-2 bg-inverse-surface text-inverse-on-surface rounded-full font-label-md text-label-md shadow-lg z-50 flex items-center gap-2";
    notification.innerHTML = `<span class="material-symbols-outlined text-[16px] text-tertiary-fixed">check_circle</span><span>${msg}</span>`;
    document.body.appendChild(notification);
    setTimeout(() => notification.remove(), 2000);
  }

  function saveTask() {
    const title = document.getElementById('taskTitle').value;
    if (!title.trim()) {
      document.getElementById('taskTitle').focus();
      triggerAction('Please add a task title');
      return;
    }
    triggerAction('Task saved successfully');
    setTimeout(() => history.back(), 700);
  }

  function saveDraft() {
    triggerAction('Saved to local drafts');
  }

  function resetForm() {
    document.getElementById('taskTitle').value = '';
    document.getElementById('taskDesc').value = '';
    updateTitleCount(document.getElementById('taskTitle'));
    triggerAction('Form cleared');
  }
</script></main></body></html>
